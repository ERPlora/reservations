[package]
name = "reservations-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
# Contrato host↔guest del Tier 2 (Input/Output/Operation/Event). El crate canónico
# vive en el repo del Hub; ruta relativa desde modules-workspace/modules/<id>/handler.
erplora-guest-sdk = { path = "../../../../hub/crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

[workspace]
